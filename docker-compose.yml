services:
  db:
    image: postgres:16-alpine
    container_name: todo_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo123
      POSTGRES_DB: tododb
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d tododb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: todo_backend
    environment:
      DATABASE_URL: postgresql://todo_user:todo123@db:5432/tododb?schema=public
      PORT: 8000
      HOST: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: todo_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
